x-peka-build: &peka-build
  context: .
  dockerfile: Dockerfile
  args:
    PEKA_CONNECTOR_VERSION: ${PEKA_CONNECTOR_VERSION:-0.3.0.dev0}
    PEKA_BUILD_REVISION: ${PEKA_BUILD_REVISION:-local}
    PEKA_BUILD_CREATED: ${PEKA_BUILD_CREATED:-unknown}
    PEKA_BUILD_SOURCE: ${PEKA_BUILD_SOURCE:-local}

services:
  volume-init:
    build: *peka-build
    image: peka-connector:${PEKA_CONNECTOR_VERSION:-0.3.0.dev0}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/state /data/config /data/logs /data/spool /data/sources
        chown 10001:10001 /data /data/state /data/config /data/logs /data/spool /data/sources
        chmod 0755 /data /data/sources
        chmod 0700 /data/state /data/config /data/logs /data/spool
        chown 10001:10001 /managed/documents /managed/cmdb
        chmod 0700 /managed/documents /managed/cmdb
    volumes:
      - peka-data:/data
      - connector_documents:/managed/documents
      - connector_cmdb:/managed/cmdb
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    restart: "no"

  connector:
    build: *peka-build
    image: peka-connector:${PEKA_CONNECTOR_VERSION:-0.3.0.dev0}
    restart: unless-stopped
    environment:
      PEKA_ENVIRONMENT: production
      PEKA_DATABASE_URL: sqlite+aiosqlite:////data/state/peka.db
      # Optional only for a one-time, backwards-compatible migration. The
      # entrypoint persists existing values, or generates new values, under
      # /data/config/secrets and uses those files on later starts.
      PEKA_JWT_SECRET: ${PEKA_JWT_SECRET:-}
      PEKA_ENCRYPTION_KEY: ${PEKA_ENCRYPTION_KEY:-}
      PEKA_BOOTSTRAP_ADMIN_USERNAME: ${PEKA_BOOTSTRAP_ADMIN_USERNAME:-}
      PEKA_BOOTSTRAP_ADMIN_PASSWORD: ${PEKA_BOOTSTRAP_ADMIN_PASSWORD:-}
      PEKA_LOG_LEVEL: ${PEKA_LOG_LEVEL:-INFO}
      PEKA_EXTERNAL_SOURCES_ROOT: /data/external-sources
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - peka-data:/data
      - ${PEKA_SOURCES_PATH:-./sources}:/data/external-sources:ro
      - connector_documents:/data/sources/documents
      - connector_cmdb:/data/sources/cmdb
    ports:
      - "${PEKA_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true

volumes:
  peka-data:
  connector_documents:
  connector_cmdb:
