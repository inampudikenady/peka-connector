services:
  connector:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PEKA_ENVIRONMENT: production
      PEKA_DATABASE_URL: sqlite+aiosqlite:////data/state/peka.db
      PEKA_JWT_SECRET: ${PEKA_JWT_SECRET:?Set PEKA_JWT_SECRET to at least 32 random characters}
      PEKA_ENCRYPTION_KEY: ${PEKA_ENCRYPTION_KEY:?Set PEKA_ENCRYPTION_KEY to at least 32 random characters}
      PEKA_BOOTSTRAP_ADMIN_USERNAME: ${PEKA_BOOTSTRAP_ADMIN_USERNAME:-}
      PEKA_BOOTSTRAP_ADMIN_PASSWORD: ${PEKA_BOOTSTRAP_ADMIN_PASSWORD:-}
      PEKA_LOG_LEVEL: ${PEKA_LOG_LEVEL:-INFO}
    volumes:
      - peka-data:/data
      - ${PEKA_SOURCES_PATH:-./sources}:/data/sources:ro
    ports:
      - "${PEKA_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true

volumes:
  peka-data:
